# XcodeGen spec. Regenerate with: xcodegen generate
# Sources use synchronized (buildable) folders — add/remove Swift files freely
# under iPrompter/ or iPrompterTests/ WITHOUT regenerating the project.
name: iPrompter
options:
  bundleIdPrefix: com.iprompter
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  iPrompter:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: iPrompter
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iprompter.iPrompter
        PRODUCT_NAME: iPrompter
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
  iPrompterTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: iPrompterTests
        type: syncedFolder
    settings:
      base:
        # Multiplatform-safe test host (Xcode template style):
        # BUNDLE_EXECUTABLE_FOLDER_PATH is empty on iOS and "Contents/MacOS"
        # on macOS. Overrides XcodeGen's auto-generated iOS-only TEST_HOST.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iPrompter.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iPrompter"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: iPrompter
schemes:
  iPrompter:
    build:
      targets:
        iPrompter: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [iPrompterTests]

# XcodeGen spec. Regenerate with: xcodegen generate
# Sources use synchronized (buildable) folders — add/remove Swift files freely
# under eTeleprompter/ or eTeleprompterTests/ WITHOUT regenerating the project.
name: eTeleprompter
options:
  bundleIdPrefix: com.iprompter
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    # Device builds need a real Apple Development identity; macOS keeps ad-hoc
    # signing so local Mac builds/tests need no provisioning round trip.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development"
    # DEVELOPMENT_TEAM is NOT set here on purpose — see Config/Signing.xcconfig.
targets:
  eTeleprompter:
    type: application
    supportedDestinations: [iOS, macOS]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: eTeleprompter
        type: syncedFolder
    settings:
      base:
        # Bundle id is permanently bound to the App Store record
        # (app 6805915935) and predates the rename — do not change it.
        PRODUCT_BUNDLE_IDENTIFIER: com.iprompter.iPrompter
        PRODUCT_NAME: eTeleprompter
        INFOPLIST_KEY_CFBundleDisplayName: eTeleprompter
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Fully offline app with no encryption beyond what the OS provides:
        # declaring this up front avoids the export-compliance question on
        # every App Store Connect upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: "1.0"
  eTeleprompterTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: eTeleprompterTests
        type: syncedFolder
    settings:
      base:
        # Multiplatform-safe test host (Xcode template style):
        # BUNDLE_EXECUTABLE_FOLDER_PATH is empty on iOS and "Contents/MacOS"
        # on macOS. Overrides XcodeGen's auto-generated iOS-only TEST_HOST.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/eTeleprompter.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/eTeleprompter"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: eTeleprompter
schemes:
  eTeleprompter:
    build:
      targets:
        eTeleprompter: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [eTeleprompterTests]
